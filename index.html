</head>
<body>
<style>
  :root{
    --cream:#F5EDDD; --red:#EC3013; --green:#1F4630; --lime:#D9F24C; --ink:#201E1D; --ash:#7D7979;
    --sat:env(safe-area-inset-top,0px);
    --sab:env(safe-area-inset-bottom,0px);
    --sal:env(safe-area-inset-left,0px);
    --sar:env(safe-area-inset-right,0px);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;height:100%}
  body{
    background:var(--ink);
    font-family:Archivo,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
    color:var(--cream);
    overscroll-behavior-y:none;
  }
  /* The device column: full screen on a phone, centered phone-width on desktop */
  #app{
    max-width:440px;
    margin:0 auto;
    min-height:100dvh;
    background:var(--red);
    position:relative;
    overflow-x:hidden;
    overflow-y:auto;
    -webkit-overflow-scrolling:touch;
  }
  @media (min-width:520px){
    body{display:flex;align-items:center;justify-content:center;padding:24px 0;background:var(--cream)}
    #app{min-height:min(880px,calc(100dvh - 48px));height:min(880px,calc(100dvh - 48px));border:3px solid var(--ink);box-shadow:14px 14px 0 rgba(32,30,29,0.9)}
  }
  textarea,button{font-family:inherit}
  textarea:focus{border-color:var(--red)!important}
  .tap{cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none}
  @media (hover:hover){
    .task:hover{filter:brightness(1.07)}
    .btn-red:hover{filter:brightness(0.92)}
    .lime-hover:hover{background:var(--lime)!important;color:var(--green)!important}
    .green-hover:hover{background:var(--green)!important}
    .quiet:hover{color:var(--lime)!important}
    .daycell:hover{background:var(--green)!important;color:var(--lime)!important}
  }
  .task:active{transform:scale(0.996)}
  @keyframes stampIn{0%{transform:scale(1.5);opacity:0}60%{transform:scale(.95);opacity:1}100%{transform:scale(1);opacity:1}}
  @keyframes riseIn{from{transform:translateY(16px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes quoteIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
  @keyframes quoteOut{from{opacity:1}to{opacity:0}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:0.001ms!important;animation-iteration-count:1!important}}
  ::selection{background:var(--lime);color:var(--ink)}
  ::-webkit-scrollbar{width:0;height:0}
</style>

  /* ---------- content ---------- */
  var CREAM="#F5EDDD", RED="#EC3013", GREEN="#1F4630", LIME="#D9F24C";

  var TASKS=[
    {label:"Progress photo", hint:"Same light, same spot"},
    {label:"Follow the diet", hint:"No cheat meals"},
    {label:"Workout one", hint:"45 minutes · anywhere"},
    {label:"Workout two", hint:"45 minutes · outside, no matter what"},
    {label:"One gallon of water", hint:"Plain water only"},
    {label:"Read ten pages", hint:"Non-fiction · paper"}
  ];
  var VERSES=[
    {text:"Get wisdom, get understanding: forget it not.", ref:"Proverbs 4:5", punch:"Six boxes. Zero excuses. Sleep, then do it again."},
    {text:"Iron sharpeneth iron; so a man sharpeneth the countenance of his friend.", ref:"Proverbs 27:17", punch:"Today you were the iron. Tomorrow you're the edge."},
    {text:"The soul of the diligent shall be made fat.", ref:"Proverbs 13:4", punch:"Diligence is boring. That is the entire trick."},
    {text:"Commit thy works unto the LORD, and thy thoughts shall be established.", ref:"Proverbs 16:3", punch:"The plan held because you held it."},
    {text:"A just man falleth seven times, and riseth up again.", ref:"Proverbs 24:16", punch:"Falling isn't the disqualifier. Staying down is."},
    {text:"He that hath no rule over his own spirit is like a city broken down.", ref:"Proverbs 25:28", punch:"You laid wall today. Keep laying brick."},
    {text:"Whatsoever thy hand findeth to do, do it with thy might.", ref:"Ecclesiastes 9:10", punch:"Might, not mood. Mood was never invited."}
  ];
  var OPENERS=[
    {pre:"", hot:"Easy", post:" never pays well."},
    {pre:"Nothing great is given, it's ", hot:"earned", post:"."},
    {pre:"History forgets whiners, but remembers ", hot:"winners", post:"."},
    {pre:"You are where you are ", hot:"because of you", post:"."},
    {pre:"Nobody who you wanna be ", hot:"floats", post:" through the day."},
    {pre:"All great things come with ", hot:"sacrifice", post:"."},
    {pre:"The only thing relevant to your success is your ", hot:"actions", post:"."},
    {pre:"You can't cut down a tree with a ", hot:"single swing", post:" of an axe."},
    {pre:"", hot:"Big dreams", post:" don't cost any more than little ones."},
    {pre:"Instead of thinking how hard your journey is, think how ", hot:"great your story", post:" will be."}
  ];

  /* ---------- persistent state ---------- */
  var KEY="seventyfive.v1";
  var DEFAULT={day:1, done:[false,false,false,false,false,false], resets:0, cleared:[], committed:false, diet:""};
  var state=load();
  state.screen="splash";
  state.opener=Math.floor(Math.random()*OPENERS.length);
  state.fading=false;
  state.draft="";

  function load(){
    try{
      var raw=localStorage.getItem(KEY);
      if(!raw) return clone(DEFAULT);
      var s=JSON.parse(raw); var d=clone(DEFAULT);
      d.day=clamp(s.day,1,75); d.resets=s.resets||0; d.committed=!!s.committed; d.diet=s.diet||"";
      d.cleared=Array.isArray(s.cleared)?s.cleared.filter(function(n){return n>=1&&n<=75}):[];
      d.done=(Array.isArray(s.done)&&s.done.length===6)?s.done.map(Boolean):[false,false,false,false,false,false];
      return d;
    }catch(e){ return clone(DEFAULT); }
  }
  function save(){
    try{
      localStorage.setItem(KEY, JSON.stringify({
        day:state.day, done:state.done, resets:state.resets,
        cleared:state.cleared, committed:state.committed, diet:state.diet
      }));
    }catch(e){}
  }
  function clone(o){ return JSON.parse(JSON.stringify(o)); }
  function clamp(n,a,b){ n=parseInt(n,10); if(isNaN(n))return a; return Math.max(a,Math.min(b,n)); }

  /* ---------- actions ---------- */
  var splashT1, splashT2;
  function armSplash(){
    clearTimeout(splashT1); clearTimeout(splashT2);
    splashT1=setTimeout(function(){ state.fading=true; render(); }, 3700);
    splashT2=setTimeout(dismissSplash, 4200);
  }
  function dismissSplash(){
    clearTimeout(splashT1); clearTimeout(splashT2);
    if(state.screen!=="splash") return;
    state.screen = state.committed ? "today" : "commit";
    state.fading=false; render();
  }
  function replaySplash(){
    clearTimeout(splashT1); clearTimeout(splashT2);
    state.screen="splash"; state.fading=false;
    state.opener=(state.opener + 1 + Math.floor(Math.random()*(OPENERS.length-1))) % OPENERS.length;
    render(); armSplash();
  }
  function commitNow(){
    var t=(state.draft||"").trim();
    if(!t) return;
    state.committed=true; state.diet=t; state.screen="today"; save(); render();
  }
  function toggle(i){
    state.done[i]=!state.done[i];
    if(state.done.every(Boolean)) state.screen="verse";
    save(); render();
  }
  function nextDay(){
    if(state.cleared.indexOf(state.day)===-1) state.cleared.push(state.day);
    state.day=Math.min(75, state.day+1);
    state.done=[false,false,false,false,false,false];
    state.screen="today"; save(); render();
  }
  function hardReset(){
    state.day=1; state.done=[false,false,false,false,false,false]; state.cleared=[];
    state.resets=state.resets+1; state.screen="commit"; state.committed=false; state.diet=""; state.draft="";
    save(); render();
  }
  function setDay(n){
    state.day=n; var prior=[]; for(var i=1;i<n;i++) prior.push(i);
    state.cleared=prior; state.done=[false,false,false,false,false,false];
    save(); render();
  }
  function go(scr){ state.screen=scr; render(); }

  /* ---------- helpers ---------- */
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];}); }
  function pad2(n){ return String(n).padStart(2,"0"); }
  var TOPS = "max(44px, calc(var(--sat) + 30px))";      // standard screen top padding
  var TOPT = "max(96px, calc(var(--sat) + 82px))";      // today screen (taller header clearance)
  var BOT  = "calc(var(--sab) + 28px)";                  // sticky/bottom actions

  /* ---------- screens ---------- */
  function screenSplash(){
    var q=OPENERS[state.opener];
    var anim = state.fading ? "quoteOut .5s ease-in both" : "quoteIn .55s ease-out both";
    return '<div class="tap" data-act="dismiss" style="min-height:100dvh;background:'+CREAM+';color:'+GREEN+';display:flex;flex-direction:column;justify-content:center;padding:'+TOPS+' 26px calc(var(--sab) + 40px);animation:'+anim+'">'+
      '<div style="font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:0.24em;text-transform:uppercase;color:'+RED+';margin-bottom:20px">75 Hard</div>'+
      '<div style="font:800 40px/1.06 Archivo,sans-serif;letter-spacing:-0.03em;text-wrap:pretty;color:'+GREEN+'">'+esc(q.pre)+'<span style="background:'+RED+';color:'+CREAM+';padding:0 6px;-webkit-box-decoration-break:clone;box-decoration-break:clone">'+esc(q.hot)+'</span>'+esc(q.post)+'</div>'+
      '<div style="font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:0.18em;text-transform:uppercase;color:'+GREEN+';opacity:0.55;margin-top:22px">Andy Frisella</div>'+
    '</div>';
  }

  function screenCommit(){
    var t=(state.draft||"").trim();
    var btnBg=t?RED:"rgba(32,30,29,0.18)", btnFg=t?CREAM:"rgba(32,30,29,0.45)";
    return '<div style="min-height:100dvh;background:'+CREAM+';color:'+GREEN+';display:flex;flex-direction:column;padding:'+TOPS+' 26px calc(var(--sab) + 34px);animation:quoteIn .45s ease-out both">'+
      '<div style="font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:0.24em;text-transform:uppercase;color:'+RED+'">Before day one</div>'+
      '<div style="font:900 46px/0.92 Archivo,sans-serif;letter-spacing:-0.04em;text-transform:uppercase;margin-top:16px;color:'+GREEN+'">Name<br>your diet.</div>'+
      '<div style="font:italic 400 22px/1.22 \'Instrument Serif\',Georgia,serif;margin-top:16px;text-wrap:pretty;color:'+GREEN+'">Write the rules you are agreeing to. Once you commit, they lock for all 75 days.</div>'+
      '<textarea id="draft" rows="5" placeholder="e.g. Whole foods only. No sugar, no bread, no eating after 8pm." style="margin-top:22px;width:100%;resize:none;background:transparent;border:3px solid '+GREEN+';padding:14px;font:600 16px/1.4 Archivo,sans-serif;color:'+GREEN+';outline:none">'+esc(state.draft)+'</textarea>'+
      '<div style="font:600 10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:0.12em;text-transform:uppercase;color:#7D7979;margin-top:10px">No edits until you finish or fail. Keep your word.</div>'+
      '<div style="flex:1;min-height:16px"></div>'+
      '<div class="tap btn-red" data-act="commit" style="padding:22px;font:900 18px/1 Archivo,sans-serif;letter-spacing:0.04em;text-transform:uppercase;text-align:center;background:'+btnBg+';color:'+btnFg+'">I\'m committed</div>'+
    '</div>';
  }

  function screenSettings(){
    var picks="";
    for(var n=1;n<=75;n++){
      var on=n===state.day;
      picks+='<div class="tap daycell" data-act="setday" data-n="'+n+'" style="aspect-ratio:1;border:3px solid '+CREAM+';display:flex;align-items:center;justify-content:center;font:900 17px/1 Archivo,sans-serif;background:'+(on?LIME:"transparent")+';color:'+(on?GREEN:CREAM)+'">'+pad2(n)+'</div>';
    }
    return '<div style="min-height:100dvh;display:flex;flex-direction:column;background:'+RED+'">'+
      '<div style="padding:'+TOPS+' 20px 18px;border-bottom:3px solid '+CREAM+';display:flex;align-items:center;justify-content:space-between;gap:12px">'+
        '<div style="font:900 44px/0.9 Archivo,sans-serif;letter-spacing:-0.04em;text-transform:uppercase">Settings</div>'+
        '<div class="tap lime-hover" data-act="today" style="font:800 12px/1 Archivo,sans-serif;letter-spacing:0.1em;text-transform:uppercase;color:'+RED+';background:'+CREAM+';padding:12px 14px;flex:none">Done</div>'+
      '</div>'+
      '<div style="padding:20px 20px 22px;border-bottom:2px solid rgba(245,237,221,0.42)">'+
        '<div style="font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:0.2em;text-transform:uppercase;color:'+LIME+'">What day are you on?</div>'+
        '<div style="font:italic 400 21px/1.2 \'Instrument Serif\',Georgia,serif;margin:8px 0 14px">Started before the app? Pick the day you are actually on. Everything before it counts as done.</div>'+
        '<div style="display:grid;grid-template-columns:repeat(5,1fr);gap:7px;max-height:214px;overflow-y:auto;padding-right:4px">'+picks+'</div>'+
      '</div>'+
      '<div style="padding:20px 20px 30px">'+
        '<div style="display:flex;align-items:baseline;justify-content:space-between;gap:10px">'+
          '<div style="font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:0.2em;text-transform:uppercase;color:'+LIME+'">Your diet &#183; locked</div>'+
          '<div style="font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:0.14em;text-transform:uppercase;color:rgba(245,237,221,0.6)">Day '+state.day+' of 75</div>'+
        '</div>'+
        '<div style="margin-top:12px;border:3px solid rgba(245,237,221,0.4);padding:14px;font:600 16px/1.4 Archivo,sans-serif;color:rgba(245,237,221,0.75);background:rgba(31,70,48,0.35);white-space:pre-wrap">'+esc(state.diet||"No diet set yet.")+'</div>'+
        '<div style="font:600 10px/1.5 ui-monospace,Menlo,monospace;letter-spacing:0.12em;text-transform:uppercase;color:rgba(245,237,221,0.6);margin-top:10px">Unlocks when you finish the 75 or start over.</div>'+
      '</div>'+
    '</div>';
  }

  function screenToday(){
    var doneCount=state.done.filter(Boolean).length;
    var left=6-doneCount;
    var pips="";
    for(var i=0;i<6;i++) pips+='<div style="flex:1;height:9px;background:'+(state.done[i]?LIME:"rgba(245,237,221,0.32)")+'"></div>';
    var rows="";
    for(var j=0;j<TASKS.length;j++){
      var on=state.done[j];
      rows+='<div class="tap task" data-act="toggle" data-i="'+j+'" style="display:flex;align-items:center;gap:14px;padding:0 20px;height:78px;border-bottom:2px solid rgba(245,237,221,0.28);background:'+(on?GREEN:"transparent")+'">'+
        '<div style="width:27px;height:27px;flex:none;border:3px solid '+(on?LIME:CREAM)+';background:'+(on?LIME:"transparent")+';display:flex;align-items:center;justify-content:center;font:900 15px/1 Archivo,sans-serif;color:'+GREEN+'">'+(on?"✕":"")+'</div>'+
        '<div style="flex:1;min-width:0">'+
          '<div style="font:800 20px/1.05 Archivo,sans-serif;letter-spacing:-0.02em;text-transform:uppercase;color:'+(on?LIME:CREAM)+';text-decoration:'+(on?"line-through":"none")+';text-decoration-thickness:3px">'+esc(TASKS[j].label)+'</div>'+
          '<div style="font:600 10px/1.3 ui-monospace,Menlo,monospace;letter-spacing:0.1em;text-transform:uppercase;color:'+(on?"rgba(217,242,76,0.65)":"rgba(245,237,221,0.65)")+';margin-top:4px">'+esc(TASKS[j].hint)+'</div>'+
        '</div>'+
        '<div style="font:900 12px/1 Archivo,sans-serif;color:'+(on?"rgba(217,242,76,0.65)":"rgba(245,237,221,0.65)")+'">'+pad2(j+1)+'</div>'+
      '</div>';
    }
    return '<div style="display:flex;flex-direction:column;min-height:100dvh;background:'+RED+'">'+
      '<div style="padding:'+TOPT+' 20px 0;display:flex;align-items:center;justify-content:space-between">'+
        '<div class="tap quiet" data-act="replay" style="font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:0.18em;text-transform:uppercase;color:rgba(245,237,221,0.72);padding:6px 0">Today &#183; new quote</div>'+
        '<div class="tap" data-act="grid" style="display:flex;flex-direction:column;gap:3px;padding:8px">'+
          '<div style="width:22px;height:3px;background:'+CREAM+'"></div><div style="width:22px;height:3px;background:'+LIME+'"></div><div style="width:22px;height:3px;background:'+CREAM+'"></div>'+
        '</div>'+
      '</div>'+
      '<div style="padding:4px 20px 16px">'+
        '<div style="display:flex;align-items:flex-end;gap:10px">'+
          '<div style="font:800 13px/1 Archivo,sans-serif;letter-spacing:0.16em;text-transform:uppercase;padding-bottom:15px">Day</div>'+
          '<div style="font:900 112px/0.78 Archivo,sans-serif;letter-spacing:-0.06em">'+state.day+'</div>'+
          '<div style="font:600 12px/1 ui-monospace,Menlo,monospace;color:rgba(245,237,221,0.72);padding-bottom:17px">/ 75</div>'+
        '</div>'+
        '<div style="display:flex;gap:3px;margin-top:12px">'+pips+'</div>'+
        '<div style="display:flex;justify-content:space-between;margin-top:7px;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:0.12em;text-transform:uppercase;color:rgba(245,237,221,0.72)"><span>'+doneCount+' of 6 logged</span><span>'+(left===0?"day cleared":left+" to go")+'</span></div>'+
      '</div>'+
      '<div style="padding:16px 20px 18px;border-top:2px solid rgba(245,237,221,0.42);border-bottom:2px solid rgba(245,237,221,0.42)">'+
        '<div style="font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:0.2em;text-transform:uppercase;color:'+LIME+';margin-bottom:8px">Mission</div>'+
        '<div style="font:italic 400 27px/1.18 \'Instrument Serif\',Georgia,serif;text-wrap:pretty">Faithfully stewarding the gifts and relationships God entrusts to me.</div>'+
      '</div>'+
      '<div style="flex:1">'+rows+'</div>'+
      '<div style="position:sticky;bottom:0;display:grid;grid-template-columns:1fr 1fr;border-top:3px solid '+CREAM+';background:'+RED+'">'+
        '<div class="tap green-hover" data-act="grid" style="padding:20px 20px '+BOT+';font:800 14px/1 Archivo,sans-serif;letter-spacing:0.06em;text-transform:uppercase;border-right:3px solid '+CREAM+';color:'+CREAM+'">All 75 days</div>'+
        '<div class="tap lime-hover" data-act="fail" style="padding:20px 20px '+BOT+';font:800 14px/1 Archivo,sans-serif;letter-spacing:0.06em;text-transform:uppercase;background:'+CREAM+';color:'+RED+'">I missed one</div>'+
      '</div>'+
    '</div>';
  }

  function screenGrid(){
    var tiles="";
    for(var n=1;n<=75;n++){
      var isCleared=state.cleared.indexOf(n)!==-1;
      var isNow=n===state.day;
      var bg=isCleared?CREAM:(isNow?LIME:"transparent");
      var border=isNow?LIME:CREAM;
      var fg=isCleared?RED:(isNow?GREEN:CREAM);
      tiles+='<div style="position:relative;aspect-ratio:1;background:'+bg+';border:3px solid '+border+';display:flex;align-items:center;justify-content:center;overflow:hidden">'+
        '<div style="font:900 18px/1 Archivo,sans-serif;color:'+fg+'">'+pad2(n)+'</div>'+
        (isCleared?'<div style="position:absolute;left:-14%;top:calc(50% - 2px);width:128%;height:4px;background:'+RED+';transform:rotate(-32deg)"></div>':'')+
      '</div>';
    }
    return '<div style="display:flex;flex-direction:column;min-height:100dvh;background:'+RED+'">'+
      '<div style="padding:'+TOPS+' 20px 18px;border-bottom:3px solid '+CREAM+'">'+
        '<div style="display:flex;align-items:center;justify-content:space-between;gap:12px">'+
          '<div style="font:900 44px/0.9 Archivo,sans-serif;letter-spacing:-0.04em;text-transform:uppercase">All 75</div>'+
          '<div class="tap lime-hover" data-act="today" style="font:800 12px/1 Archivo,sans-serif;letter-spacing:0.1em;text-transform:uppercase;color:'+RED+';background:'+CREAM+';padding:12px 14px;flex:none">Back to day '+state.day+'</div>'+
        '</div>'+
        '<div style="display:flex;margin-top:16px;border:3px solid '+CREAM+'">'+
          '<div style="flex:1;padding:10px 12px;border-right:3px solid '+CREAM+'"><div style="font:900 30px/1 Archivo,sans-serif">'+state.cleared.length+'</div><div style="font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:0.14em;text-transform:uppercase;color:rgba(245,237,221,0.75);margin-top:5px">Crossed off</div></div>'+
          '<div style="flex:1;padding:10px 12px;border-right:3px solid '+CREAM+';background:'+LIME+';color:'+GREEN+'"><div style="font:900 30px/1 Archivo,sans-serif">'+(75-state.cleared.length)+'</div><div style="font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:0.14em;text-transform:uppercase;margin-top:5px">Left</div></div>'+
          '<div style="flex:1;padding:10px 12px;background:'+GREEN+'"><div style="font:900 30px/1 Archivo,sans-serif;color:'+LIME+'">'+state.resets+'</div><div style="font:600 9px/1 ui-monospace,Menlo,monospace;letter-spacing:0.14em;text-transform:uppercase;color:rgba(245,237,221,0.75);margin-top:5px">Restarts</div></div>'+
        '</div>'+
      '</div>'+
      '<div style="flex:1;padding:18px 20px 24px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-content:start">'+tiles+'</div>'+
      '<div style="border-top:2px solid rgba(245,237,221,0.42);padding:16px 20px 18px;font:italic 400 20px/1.25 \'Instrument Serif\',Georgia,serif;color:'+CREAM+'">One miss and the grid empties. That is the whole deal.</div>'+
      '<div class="tap lime-hover" data-act="settings" style="border-top:3px solid '+CREAM+';padding:20px 20px '+BOT+';font:800 14px/1 Archivo,sans-serif;letter-spacing:0.06em;text-transform:uppercase;background:'+CREAM+';color:'+RED+'">Settings &#183; day &amp; diet</div>'+
    '</div>';
  }

  function screenVerse(){
    var v=VERSES[(state.day-1)%VERSES.length];
    var nextNum=Math.min(75, state.day+1);
    return '<div style="min-height:100dvh;background:'+GREEN+';display:flex;flex-direction:column;padding:'+TOPS+' 22px calc(var(--sab) + 30px)">'+
      '<div style="align-self:flex-start;background:'+LIME+';color:'+GREEN+';font:900 12px/1 Archivo,sans-serif;letter-spacing:0.16em;text-transform:uppercase;white-space:nowrap;padding:9px 12px;animation:stampIn .4s cubic-bezier(.2,1.4,.4,1) both">Day '+state.day+' &#183; cleared</div>'+
      '<div style="font:900 78px/0.82 Archivo,sans-serif;letter-spacing:-0.05em;text-transform:uppercase;margin-top:22px;animation:riseIn .4s .08s both">All<br>six<br><span style="color:'+LIME+'">done.</span></div>'+
      '<div style="height:3px;background:'+RED+';margin:24px 0 20px"></div>'+
      '<div style="font:italic 400 30px/1.18 \'Instrument Serif\',Georgia,serif;text-wrap:pretty;animation:riseIn .4s .16s both">“'+esc(v.text)+'”</div>'+
      '<div style="font:600 11px/1 ui-monospace,Menlo,monospace;letter-spacing:0.16em;text-transform:uppercase;color:'+LIME+';margin-top:14px">'+esc(v.ref)+'</div>'+
      '<div style="font:800 17px/1.3 Archivo,sans-serif;color:'+CREAM+';margin-top:24px;text-wrap:pretty">'+esc(v.punch)+'</div>'+
      '<div style="flex:1;min-height:20px"></div>'+
      '<div class="tap lime-hover" data-act="nextday" style="background:'+RED+';color:'+CREAM+';padding:22px;font:900 18px/1 Archivo,sans-serif;letter-spacing:0.04em;text-transform:uppercase;text-align:center">Lock it &#8594; day '+nextNum+'</div>'+
      '<div class="tap quiet" data-act="grid" style="padding:14px 0 0;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:0.14em;text-transform:uppercase;color:rgba(245,237,221,0.6);text-align:center">See the grid</div>'+
    '</div>';
  }

  function screenFail(){
    return '<div style="min-height:100dvh;background:'+RED+';display:flex;flex-direction:column;padding:'+TOPS+' 22px calc(var(--sab) + 30px)">'+
      '<div style="font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:0.2em;text-transform:uppercase;color:rgba(245,237,221,0.85)">Day '+state.day+' broke the rules</div>'+
      '<div style="flex:1;display:flex;flex-direction:column;justify-content:center">'+
        '<div style="font:900 100px/0.8 Archivo,sans-serif;letter-spacing:-0.06em;text-transform:uppercase;animation:riseIn .35s both">Day 1.</div>'+
        '<div style="font:900 100px/0.8 Archivo,sans-serif;letter-spacing:-0.06em;text-transform:uppercase;color:'+GREEN+';animation:riseIn .35s .1s both">Again.</div>'+
        '<div style="height:3px;background:'+CREAM+';margin:24px 0 18px;width:58%"></div>'+
        '<div style="font:italic 400 24px/1.2 \'Instrument Serif\',Georgia,serif;max-width:310px;text-wrap:pretty">No substitutions, no half days. The count goes back to zero, and so do you.</div>'+
      '</div>'+
      '<div class="tap lime-hover" data-act="reset" style="background:'+GREEN+';color:'+CREAM+';padding:22px;font:900 18px/1 Archivo,sans-serif;letter-spacing:0.04em;text-transform:uppercase;text-align:center">Start over</div>'+
      '<div class="tap" data-act="today" style="padding:14px 0 0;font:600 10px/1 ui-monospace,Menlo,monospace;letter-spacing:0.14em;text-transform:uppercase;color:rgba(245,237,221,0.75);text-align:center">Wait &#8212; I did it</div>'+
    '</div>';
  }

  /* ---------- render + events ---------- */
  var app=document.getElementById("app");
  function render(){
    var scr=state.screen, html;
    if(scr==="splash") html=screenSplash();
    else if(scr==="commit") html=screenCommit();
    else if(scr==="settings") html=screenSettings();
    else if(scr==="grid") html=screenGrid();
    else if(scr==="verse") html=screenVerse();
    else if(scr==="fail") html=screenFail();
    else html=screenToday();
    app.innerHTML=html;
    if(scr!=="today" && scr!=="grid") app.scrollTop=0;
    var ta=document.getElementById("draft");
    if(ta){
      ta.addEventListener("input", function(){ state.draft=ta.value; var btn=app.querySelector('[data-act=commit]'); if(btn){ var t=ta.value.trim(); btn.style.background=t?RED:"rgba(32,30,29,0.18)"; btn.style.color=t?CREAM:"rgba(32,30,29,0.45)"; } });
    }
  }

  app.addEventListener("click", function(e){
    var el=e.target.closest("[data-act]"); if(!el) return;
    var act=el.getAttribute("data-act");
    if(act==="dismiss") return dismissSplash();
    if(act==="commit") return commitNow();
    if(act==="toggle") return toggle(parseInt(el.getAttribute("data-i"),10));
    if(act==="grid") return go("grid");
    if(act==="today") return go("today");
    if(act==="settings") return go("settings");
    if(act==="fail") return go("fail");
    if(act==="replay") return replaySplash();
    if(act==="nextday") return nextDay();
    if(act==="reset") return hardReset();
    if(act==="setday") return setDay(parseInt(el.getAttribute("data-n"),10));
  });

  render();
  armSplash();
})();
</script>
</body>
</html>
